<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151c" media="(prefers-color-scheme: dark)">
<title>Gold Trade Chart</title>
<meta name="description" content="ローソク足・出来高・Volume (c-c) 系インジケーターを表示するチャートサイト">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand" aria-label="Gold Trade Chart">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">Gold Trade Chart</span>
  </div>

  <label class="sr-only" for="symbol">銘柄</label>
  <select id="symbol" class="ctl"></select>

  <div id="intervals" class="seg" role="group" aria-label="時間足"></div>

  <div class="menu-wrap">
    <button id="indBtn" class="ctl btn" type="button" aria-haspopup="true" aria-expanded="false">
      <span class="long">インジケーター</span><span class="short">指標</span>
    </button>
    <div id="indMenu" class="menu" hidden></div>
  </div>

  <div class="menu-wrap">
    <button id="drawBtn" class="ctl btn" type="button" aria-haspopup="true" aria-expanded="false">ツール</button>
    <div id="drawMenu" class="menu" hidden></div>
  </div>

  <div class="spacer"></div>

  <span id="status" class="badge" role="status" title="データの取得元">読み込み中</span>
  <button id="themeBtn" class="ctl btn icon" type="button" aria-label="ライト/ダークを切り替える" title="ライト/ダークを切り替える"></button>
</header>

<div id="banner" class="banner" role="status" hidden>
  <span>デモデータを表示中です(実際の価格ではありません)</span>
  <button id="retryBtn" class="ctl btn small" type="button">再読み込み</button>
</div>

<main id="chartWrap" class="chart-wrap">
  <canvas id="chart" tabindex="0" aria-label="価格チャート。左右キーで移動、上下キーで拡大・縮小"></canvas>
  <div id="legends"></div>
  <div id="hint" class="hint" role="status" hidden>
    <span id="hintText"></span>
    <button id="hintBtn" class="ctl btn small" type="button">中止</button>
  </div>
  <div id="loading" class="loading" hidden><span class="spinner" aria-hidden="true"></span>読み込み中…</div>
  <button id="toLatest" class="fab" type="button" hidden aria-label="最新の足へ移動" title="最新の足へ移動">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 3l5 5-5 5M9 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</main>

<div id="overlay" class="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="dlg-head">
      <h2 id="dlgTitle"></h2>
      <button id="dlgClose" class="x" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab on" type="button" role="tab" data-tab="params">パラメーター</button>
      <button class="tab" type="button" role="tab" data-tab="style">スタイル</button>
      <button class="tab" type="button" role="tab" data-tab="vis">可視性</button>
    </div>
    <div id="dlgBody" class="dlg-body"></div>
    <div class="dlg-foot">
      <button id="dlgReset" class="ctl btn" type="button">デフォルトに戻す</button>
      <div class="spacer"></div>
      <button id="dlgCancel" class="ctl btn" type="button">キャンセル</button>
      <button id="dlgOk" class="ctl btn primary" type="button">OK</button>
    </div>
  </div>
</div>

<div id="symOverlay" class="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="symTitle">
    <div class="dlg-head"><h2 id="symTitle">銘柄を追加</h2></div>
    <div class="dlg-body">
      <label class="row">
        <span class="lbl">通貨ペア<small>Binance で取引されているもの(例: DOGEUSDT、BTCJPY)</small></span>
        <input id="symInput" class="ctl" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="20" placeholder="DOGEUSDT">
      </label>
      <p id="symMsg" class="msg" role="status"></p>
      <div id="symList"></div>
    </div>
    <div class="dlg-foot">
      <div class="spacer"></div>
      <button id="symCancel" class="ctl btn" type="button">キャンセル</button>
      <button id="symOk" class="ctl btn primary" type="button">追加</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
