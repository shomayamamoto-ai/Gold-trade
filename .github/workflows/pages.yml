# サイトを GitHub Pages に公開する。
# このブランチに push するたびに、自動で最新の内容に更新される。
# 事前に、リポジトリの Settings → Pages → Source を「GitHub Actions」にしておく必要がある。
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/funny-fermi-ntfkyt, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1. 公開するファイルをまとめて、GitHub に預ける
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html guide.html guide.js style.css indicators.js app.js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # 2. 預けたファイルを公開する(預け終わってから始まるので、ファイルが見つからない失敗を避けられる)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
